<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Obstgarten">
<meta name="theme-color" content="#edf1ea" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1511" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Mein Obstgarten</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
body{margin:0;font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
#gate{position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-items:center;overflow:auto;padding:max(24px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.gatecard{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:12px;text-align:center}
.gatecard h1{font-family:var(--display);margin:0;font-size:1.6rem}
.gatecard p{margin:0}
.gatecard .form{text-align:left}
.gatelogo{display:grid;place-items:center}
.gatelogo svg{width:72px;height:72px}
</style>
</head>
<body>
<style>
/* Layout: App-Shell fürs iPhone – sticky Kopfzeile, eine Ansicht pro Tab, feste Tableiste unten, Detail als Vollbild-Sheet */
:root{
  --bg:#edf1ea; --surface:#ffffff; --surface-2:#f6f8f4; --ink:#17231b; --muted:#5b6a5f; --line:#d4dcd1;
  --accent:#2f6b3a; --accent-ink:#ffffff; --grass:#dde8d3; --grid:#c4d3bc; --grid-strong:#a9bda0;
  --ok:#3a8a45; --soon:#c3870b; --due:#c23b2a; --none:#8a948c; --fallow:#d9dbd6; --fallow-line:#b9bdb5; --picto-bg:#e3ecdd; --picto-white:#ffffff; --soil:#d8c7ae; --warn-bg:#fbf1dc; --cider:#e2ad3c; --cider-trub:#d9b670; --cork:#a9784c; --glass:#eef4f1; --f-red:#c0353a; --f-plum:#6b3f7a; --f-pear:#b9c35a; --f-quince:#e6b422; --f-apricot:#ec8f3a; --cloth:#d24a4a;
  --display:'Bricolage Grotesque', -apple-system, 'Helvetica Neue', Arial, sans-serif;
  --body:-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1511; --surface:#18211b; --surface-2:#1d2820; --ink:#e5ede6; --muted:#97a69b; --line:#2b372e;
  --accent:#7fc489; --accent-ink:#0c1a10; --grass:#172519; --grid:#233628; --grid-strong:#2f4a35;
  --ok:#6cc27a; --soon:#e4b244; --due:#ef6b57; --none:#7e897f; --fallow:#252a26; --fallow-line:#3a413b; --picto-bg:#1f2d22; --picto-white:#e9eee9; --soil:#4a3d2c; --warn-bg:#2e2716; --cider:#d9a136; --cider-trub:#a88b4f; --cork:#8a6440; --glass:#1c2620; --f-red:#d65459; --f-plum:#9a6aab; --f-pear:#a6b04e; --f-quince:#d6a41e; --f-apricot:#e08a3d; --cloth:#c45050; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0f1511; --surface:#18211b; --surface-2:#1d2820; --ink:#e5ede6; --muted:#97a69b; --line:#2b372e;
  --accent:#7fc489; --accent-ink:#0c1a10; --grass:#172519; --grid:#233628; --grid-strong:#2f4a35;
  --ok:#6cc27a; --soon:#e4b244; --due:#ef6b57; --none:#7e897f; --fallow:#252a26; --fallow-line:#3a413b; --picto-bg:#1f2d22; --picto-white:#e9eee9; --soil:#4a3d2c; --warn-bg:#2e2716; --cider:#d9a136; --cider-trub:#a88b4f; --cork:#8a6440; --glass:#1c2620; --f-red:#d65459; --f-plum:#9a6aab; --f-pear:#a6b04e; --f-quince:#d6a41e; --f-apricot:#e08a3d; --cloth:#c45050; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
header.top h1{font-family:var(--display);font-weight:700;font-size:1.45rem;letter-spacing:-.01em;margin:0;flex:1;min-width:0;text-wrap:balance}
header.top .sub{display:block;font-family:var(--body);font-size:.78rem;font-weight:500;color:var(--muted);letter-spacing:.02em}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.iconbtn svg{width:20px;height:20px;stroke:var(--ink);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

main .wrap{display:flex;flex-direction:column;gap:16px;padding-block:16px}
.note{font-size:.88rem;color:var(--muted);background:var(--surface-2);border:1px dashed var(--line);border-radius:var(--r);padding:10px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.note b{color:var(--ink)}
.note button{margin-left:auto}

.h2{font-family:var(--display);font-weight:700;font-size:1.15rem;margin:0}
.eyebrow{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}

/* Plan */
.planbox{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.planscroll{overflow:auto;-webkit-overflow-scrolling:touch;max-height:68vh;touch-action:pan-x pan-y}
.planscroll svg{display:block;max-width:none}
.plantools{display:flex;gap:8px;align-items:center;padding:8px 10px;border-top:1px solid var(--line);flex-wrap:wrap}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.placing{background:var(--accent);color:var(--accent-ink);border-radius:var(--r);padding:10px 12px;font-size:.9rem;display:flex;gap:10px;align-items:center}
.placing button{margin-left:auto;background:var(--accent-ink);color:var(--accent);border:0;border-radius:10px;padding:6px 12px;font-weight:600}

/* Buttons */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 14px;font-weight:600;font-size:.92rem;min-height:40px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--due);border-color:var(--due);background:transparent}
.btn.small{padding:6px 10px;min-height:34px;font-size:.85rem}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.85rem;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* Liste */
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.item{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:12px 14px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;width:100%}
.item:last-child{border-bottom:0}
.item .num{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.95rem;color:#fff;font-variant-numeric:tabular-nums}
.item .t{min-width:0}
.item .t strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .t small{display:block;color:var(--muted);font-size:.82rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{font-size:.75rem;font-weight:700;padding:4px 9px;border-radius:999px;white-space:nowrap;font-variant-numeric:tabular-nums}
.pill.ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)}
.pill.soon{color:var(--soon);background:color-mix(in srgb,var(--soon) 16%,transparent)}
.pill.due{color:var(--due);background:color-mix(in srgb,var(--due) 14%,transparent)}
.pill.none{color:var(--none);background:color-mix(in srgb,var(--none) 16%,transparent)}
.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px}
.empty{padding:28px 16px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:var(--r)}

/* Kennzahlen */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.stat .v{font-family:var(--display);font-size:1.5rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.stat .l{font-size:.75rem;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.chart svg{display:block;width:100%;height:auto;max-height:300px}
table.t{width:100%;border-collapse:collapse;font-size:.9rem;font-variant-numeric:tabular-nums}
table.t th{text-align:left;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:6px 4px;border-bottom:1px solid var(--line)}
table.t td{padding:8px 4px;border-bottom:1px solid var(--line)}
table.t tr:last-child td{border-bottom:0}
table.t .r{text-align:right}
.up{color:var(--ok)} .down{color:var(--due)}
.tablewrap{overflow-x:auto}

/* Tableiste */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:760px;margin:0 auto;display:grid;grid-auto-flow:column;grid-auto-columns:1fr}
nav.tabs button{border:0;background:transparent;padding:8px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.7rem;font-weight:600;color:var(--muted);position:relative;min-width:0}
nav.tabs button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--accent)}
nav.tabs .badge{position:absolute;top:4px;left:calc(50% + 6px);background:var(--due);color:#fff;border-radius:999px;font-size:.65rem;min-width:17px;height:17px;padding:0 4px;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.fab{position:fixed;right:max(16px,calc(env(safe-area-inset-right,0px) + 16px));bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:24;width:56px;height:56px;border-radius:18px;border:0;background:var(--accent);color:var(--accent-ink);box-shadow:0 6px 18px rgba(0,0,0,.18);display:grid;place-items:center}
.fab svg{width:26px;height:26px;stroke:currentColor;stroke-width:2.2;fill:none;stroke-linecap:round}

/* Sheet */
.sheet{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheethead{position:sticky;top:0;z-index:2;background:var(--bg);border-bottom:1px solid var(--line)}
.sheethead .wrap{display:flex;align-items:center;gap:10px;padding-block:10px}
.sheethead h2{flex:1;margin:0;font-family:var(--display);font-size:1.2rem;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:600;padding:8px 4px;font-size:1rem}
.sheet .wrap.body{display:flex;flex-direction:column;gap:14px;padding-block:16px}
.hero{display:flex;gap:14px;align-items:center}
.hero .big{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:1.5rem;color:#fff;flex:none;font-variant-numeric:tabular-nums}
.hero .t{min-width:0}
.hero .t strong{font-family:var(--display);font-size:1.3rem;display:block;line-height:1.2}
.hero .t span{color:var(--muted);font-size:.9rem}
dl.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;margin:0;font-size:.93rem}
dl.kv dt{color:var(--muted)}
dl.kv dd{margin:0;font-variant-numeric:tabular-nums;min-width:0}
.hint{font-size:.85rem;color:var(--muted)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form .full{grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:.78rem;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 11px;font-size:16px;min-height:44px}
.field textarea{min-height:80px;resize:vertical}
.mlist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.ptile{display:inline-grid;place-items:center;background:var(--picto-bg);border-radius:12px;flex:none;padding:6px}
.mitem .ptile{padding:4px;border-radius:9px}
.guide{display:flex;flex-direction:column;gap:10px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px}
.guide .ghead{display:flex;gap:12px;align-items:flex-start}
.guide .gt{min-width:0;display:flex;flex-direction:column;gap:4px}
.guide .gt strong{font-family:var(--display);font-size:1.05rem}
.guide p{margin:0;font-size:.9rem}
.guide .ziel{color:var(--accent);font-size:.88rem}
.guide .when{color:var(--muted);font-size:.85rem}
.guide ol{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:6px;font-size:.9rem;max-width:65ch}
.guide .warn{background:var(--warn-bg);border-radius:8px;padding:8px 10px;font-size:.85rem}
.gdet summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:.9rem;padding:2px 0}
.gdet[open] summary{margin-bottom:8px}
.guides{display:flex;flex-direction:column;gap:12px}
/* Apfelwein */
.av{border-radius:50%;object-fit:cover;vertical-align:middle;flex:none;display:inline-block}
.av0{display:inline-grid;place-items:center;background:var(--surface-2);color:var(--muted);font-size:.65rem;font-weight:700;border:1px solid var(--line)}
.pchips .chip{display:inline-flex;align-items:center;gap:6px}
.byme{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;color:var(--muted)}
.loglist{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.logitem{display:grid;grid-template-columns:28px 1fr;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);align-items:start}
.logitem:last-child{border-bottom:0}
.logitem b{font-size:.85rem}
.logitem p{margin:2px 0 0;font-size:.92rem}
.logitem small{color:var(--muted);font-size:.78rem;font-variant-numeric:tabular-nums}
.who{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--muted)}
.ptable{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.phead2{display:none}
.prow{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding:12px 14px;align-items:start}
.prow:last-child{border-bottom:0}
.pc{display:flex;flex-direction:column;gap:5px;min-width:0;align-items:flex-start}
.pbaum{grid-column:1/-1;flex-direction:row;align-items:center;gap:10px}
.pbaum .num{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.9rem;color:#fff;flex:none;font-variant-numeric:tabular-nums}
.pbaum .t{min-width:0;display:flex;flex-direction:column}
.pbaum strong{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc small{color:var(--muted);font-size:.8rem;font-variant-numeric:tabular-nums}
.plabel{font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.schs{display:flex;flex-wrap:wrap;gap:5px}
.sch{display:inline-flex;align-items:center;gap:4px;font-size:.76rem;font-weight:600;padding:2px 8px 2px 3px;border-radius:999px;border:1px solid transparent;max-width:100%}
.sch .picto{flex:none}
.sch.ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent)}
.sch.soon{color:var(--soon);background:color-mix(in srgb,var(--soon) 15%,transparent)}
.sch.due{color:var(--due);background:color-mix(in srgb,var(--due) 13%,transparent)}
.sch.todo{color:var(--ink);border:1px dashed var(--muted);background:transparent}
@media (hover:hover){.prow:hover{background:var(--surface-2)}}
@media (min-width:768px){
  .phead2{display:grid;grid-template-columns:minmax(200px,1.1fr) minmax(180px,1fr) 1.6fr;gap:14px;padding:10px 14px;border-bottom:1px solid var(--line);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--surface-2)}
  .prow{grid-template-columns:minmax(200px,1.1fr) minmax(180px,1fr) 1.6fr;align-items:center}
  .pbaum{grid-column:auto}
  .prow .plabel{display:none}
}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px;align-self:flex-start}
.seg button{border:0;background:transparent;border-radius:9px;padding:7px 16px;font-weight:600;font-size:.9rem;color:var(--muted);min-height:36px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.casks{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:12px}
.cask{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px;text-align:left;align-items:stretch;min-width:0}
.cask .cpic{display:grid;place-items:center;background:var(--picto-bg);border-radius:12px;padding:10px 0 6px}
.cask strong{font-family:var(--display);font-size:1.05rem;line-height:1.2}
.cask small{color:var(--muted);font-size:.8rem;font-variant-numeric:tabular-nums}
.prog{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.prog span{display:block;height:100%;background:var(--accent);border-radius:3px}
@media (hover:hover){.cask:hover{border-color:var(--muted)}}
.steps{display:flex;flex-direction:column;gap:0}
.step{display:grid;grid-template-columns:22px 1fr;gap:10px;position:relative;padding-bottom:14px}
.step:last-child{padding-bottom:0}
.step::before{content:"";position:absolute;left:10px;top:20px;bottom:0;width:2px;background:var(--line)}
.step:last-child::before{display:none}
.step .dot2{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:.7rem;font-weight:700;color:var(--accent-ink)}
.step.done .dot2{background:var(--accent);border-color:var(--accent)}
.step.now .dot2{border-color:var(--soon);background:color-mix(in srgb,var(--soon) 25%,var(--surface))}
.step.late .dot2{border-color:var(--due);background:color-mix(in srgb,var(--due) 20%,var(--surface))}
.step .sb{display:flex;flex-direction:column;gap:4px;min-width:0}
.step .sb b{font-size:.95rem}
.step .sb span{color:var(--muted);font-size:.85rem;font-variant-numeric:tabular-nums}

const todayISO = () => { const d = new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const fmtDate = iso => { if(!iso) return "–"; const [y,m,d] = iso.split("-"); return d+"."+m+"."+y; };
const addMonths = (iso, n) => { const [y,m,d] = iso.split("-").map(Number); const dt = new Date(y, m-1+Number(n), d); return dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0")+"-"+String(dt.getDate()).padStart(2,"0"); };
const daysUntil = iso => { const [y,m,d] = iso.split("-").map(Number); const t = new Date(); t.setHours(0,0,0,0); return Math.round((new Date(y,m-1,d) - t)/86400000); };
const kg = v => (Math.round(v*10)/10).toLocaleString("de-DE",{maximumFractionDigits:1});
const statusColor = s => `var(--${s})`;

function nextCut(t){ return t.letzterSchnitt ? addMonths(t.letzterSchnitt, t.intervall || 12) : null; }
function status(t){ const n = nextCut(t); if(!n) return "none"; const d = daysUntil(n); return d < 0 ? "due" : d <= 60 ? "soon" : "ok"; }
function dueText(t){
  const n = nextCut(t); if(!n) return "kein Schnitt erfasst";
  const d = daysUntil(n);
  if(d < 0) return `seit ${-d} Tagen fällig`;
  if(d === 0) return "heute fällig";
  if(d <= 60) return `in ${d} Tagen`;
  return fmtDate(n);
}
const byNr = (a,b) => (parseInt(a.nr)||9999) - (parseInt(b.nr)||9999) || String(a.nr).localeCompare(String(b.nr));

/* offene Pflanzenschutz-Fristen (z. B. Leimring entfernen) */

const byLine = id => id ? ` · ${esc(personName(id))}` : "";

  const s = new Set();

  trees.forEach(t => { add(t.angelegtVon); add(t.geaendertVon); add(t.letzterSchnittVon); Object.values(t.ertragMeta||{}).forEach(m => add(m && m.by)); (t.schutz||[]).forEach(m => { add(m.by); add(m.erledigtVon); }); });

/* ---------- Export / Import (vorbereitet) ---------- */
function buildExport(){
  return {
    format: EXPORT_FORMAT, version: EXPORT_VERSION, exportedAt: new Date().toISOString(),
    garten: {name: garden.name||"", flaechen: garden.flaechen},
    baeume: trees.filter(t => !t.beispiel).sort(byNr).map(t => ({id: t.id, ...plain(t)})),
    verarbeitung: batches.filter(b => !b.beispiel).map(b => ({id: b.id, ...plain(b)})),
    keller: casks.filter(c => !c.beispiel).map(c => ({id: c.id, ...plain(c)}))
  };
}
function validateImport(obj){
  if(!obj || obj.format !== EXPORT_FORMAT) return "Die Datei ist kein Obstgarten-Export.";
  if(Number(obj.version) > EXPORT_VERSION) return "Die Datei stammt aus einer neueren App-Version.";
  if(!Array.isArray(obj.baeume)) return "In der Datei fehlen die Bäume.";
  if(obj.baeume.some(b => !b || typeof b !== "object" || !b.nr)) return "Mindestens ein Baum hat keine Nummer.";
  return null;
}
/* mode: "merge" = gleiche Nummer wird überschrieben, Rest bleibt; "replace" = vorher alles löschen */
async function applyImport(obj, mode){
  const err = validateImport(obj); if(err) throw {code:"bad_file", message:err};
  if(mode === "replace") for(const t of trees) await db.collection("trees").doc(t.id).delete();
  const byNrMap = new Map(trees.map(t => [String(t.nr), t.id]));
  for(const b of obj.baeume){
    const {id, ...body} = b;
    const target = (mode !== "replace" && byNrMap.get(String(b.nr))) || id || uid();
    await db.collection("trees").doc(target).set(JSON.parse(JSON.stringify({...body, beispiel:false})));
  }
  if(Array.isArray(obj.keller)) for(const c of obj.keller){ const {id, ...body} = c; await db.collection("keller").doc(id || uid()).set(JSON.parse(JSON.stringify({...body, beispiel:false}))); }
  if(Array.isArray(obj.verarbeitung)) for(const b of obj.verarbeitung){ const {id, ...body} = b; await db.collection("verarbeitung").doc(id || uid()).set(JSON.parse(JSON.stringify({...body, beispiel:false}))); }
  if(obj.garten) await db.doc("settings/garten").set({name: obj.garten.name||"", flaechen: normFlaechen(obj.garten)});
  return obj.baeume.length;
}
async function doExport(){
  const json = JSON.stringify(buildExport(), null, 2);
  const filename = `obstgarten-${todayISO()}.json`;
  try{
    const dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null;
    if(dl){ await dl.save({filename, data: json}); toast("Export gespeichert"); return; }
  }catch(_){ }
  try{ await navigator.clipboard.writeText(json); toast("Export in die Zwischenablage kopiert"); }
  catch(_){ toast("Export nicht möglich in dieser Ansicht."); }
}

  return DEFAULT_FLAECHEN;
}

}
const plotById = id => garden.flaechen.find(f => f.id === id) || null;
const plotName = id => (plotById(id)||{}).name || "";
const isPlaced = t => t.x != null && t.y != null && !!plotById(t.flaeche);
/* Reihen laufen quer über das Grundstück (West–Ost), Reihe 1 im Norden */
const rowH = f => f.laenge / f.reihen;
const rowOf = (f, y) => Math.min(f.reihen, Math.max(1, Math.floor(y / rowH(f)) + 1));
const rowCenter = (f, i) => Math.round((i - 0.5) * rowH(f) * 10) / 10;
const isFreeRow = (f, i) => (f.freieReihen||[]).includes(i);
const plantedRows = f => f.reihen - (f.freieReihen||[]).length;
const treeRow = t => isPlaced(t) ? rowOf(plotById(t.flaeche), Number(t.y)) : (t.reihe || "");
const totalArea = () => garden.flaechen.reduce((s,f) => s + f.breite*f.laenge, 0);
function lageText(t){
  if(!isPlaced(t)) return "";
  return [plotName(t.flaeche), "Reihe "+treeRow(t)].join(", ");
}

/* ---------- Plan ---------- */
function planSVG(){
  const lay = plotLayout();
  const W = lay.length ? lay[lay.length-1].ox + lay[lay.length-1].breite : 20;
  const L = Math.max(...lay.map(f => f.laenge), 10);
  const r = Math.max(W,L)/46, padT = r*4.2, padL = r*3.2, padB = r*2.6;
  let g = "";
  lay.forEach(f => {
    const ox = f.ox, fw = f.breite, fl = f.laenge;
    g += `<rect x="${ox}" y="0" width="${fw}" height="${fl}" fill="var(--grass)" stroke="var(--grid-strong)" stroke-width="0.25" rx="0.4"/>`;
    for(let x=0; x<=fw+0.001; x+=5){ const strong = x%10===0; g += `<line x1="${ox+x}" y1="0" x2="${ox+x}" y2="${fl}" stroke="var(${strong?"--grid-strong":"--grid"})" stroke-width="${strong?0.12:0.07}"/>`; if(strong) g += `<text x="${ox+x}" y="${-r*0.7}" font-size="${r*1.05}" text-anchor="middle" fill="var(--muted)">${x}</text>`; }
    const rh = rowH(f);
    for(let i=1; i<=f.reihen; i++){
      const y0 = (i-1)*rh, yc = y0 + rh/2;
      const free = isFreeRow(f, i);
      if(free){
        g += `<rect x="${ox}" y="${y0}" width="${fw}" height="${rh}" fill="var(--fallow)"/>`;
        g += `<rect x="${ox}" y="${y0}" width="${fw}" height="${rh}" fill="url(#hatch)"/>`;
      } else if(i%2===0) g += `<rect x="${ox}" y="${y0}" width="${fw}" height="${rh}" fill="var(--grid)" opacity="0.45"/>`;
      if(i>1) g += `<line x1="${ox}" y1="${y0}" x2="${ox+fw}" y2="${y0}" stroke="var(--grid-strong)" stroke-width="0.08"/>`;
      if(!free) g += `<line x1="${ox}" y1="${yc}" x2="${ox+fw}" y2="${yc}" stroke="var(--grid-strong)" stroke-width="0.1" stroke-dasharray="0.6 0.5"/>`;
      g += `<text x="${ox+fw+r*0.5}" y="${yc+r*0.38}" font-size="${r*1.0}" font-weight="600" fill="var(--muted)" opacity="${free?0.5:1}">R${i}</text>`;
    }
    for(let y=0; y<=fl+0.001; y+=10) g += `<text x="${ox-r*0.5}" y="${y+r*0.4}" font-size="${r*0.95}" text-anchor="end" fill="var(--muted)">${y}</text>`;
    g += `<text x="${ox+fw/2}" y="${-r*2.4}" font-size="${r*1.45}" font-weight="700" text-anchor="middle" fill="var(--ink)">${esc(f.name)}</text>`;
    g += `<text x="${ox+fw/2}" y="${fl + r*1.9}" font-size="${r*1.0}" text-anchor="middle" fill="var(--muted)">${kg(fw)} × ${kg(fl)} m · ${kg(fw*fl)} m²</text>`;
  });
  const ox = Object.fromEntries(lay.map(f => [f.id, f.ox]));
  let m = "";
  trees.filter(isPlaced).sort(byNr).forEach(t => {
    const st = status(t), cx = ox[t.flaeche] + Number(t.x), cy = Number(t.y);
    const sel = sheetState && sheetState.id === t.id;
    m += `<g data-id="${esc(t.id)}" style="cursor:pointer">
      ${sel?`<circle cx="${cx}" cy="${cy}" r="${r*1.8}" fill="none" stroke="var(--ink)" stroke-width="${r*0.2}"/>`:""}
      <circle cx="${cx}" cy="${cy}" r="${r*1.25}" fill="${statusColor(st)}" stroke="var(--surface)" stroke-width="${r*0.22}"/>
      <text x="${cx}" y="${cy + r*0.42}" font-size="${r*1.15}" font-weight="700" text-anchor="middle" fill="#fff" style="pointer-events:none">${esc(t.nr)}</text>
    </g>`;
  });
  if(placing && placing.x != null && ox[placing.flaeche] != null){
    m += `<circle cx="${ox[placing.flaeche] + placing.x}" cy="${placing.y}" r="${r*1.25}" fill="none" stroke="var(--ink)" stroke-width="${r*0.25}" stroke-dasharray="${r*0.5} ${r*0.35}"/>`;
  }
  const vb = `${-padL} ${-padT} ${W+padL+r*3.6} ${L+padT+padB}`;
  const vbW = W+padL+r*3.6, vbH = L+padT+padB;
  const wide = window.matchMedia("(min-width:768px)").matches;
  const vEl = $("#view"), vCs = vEl ? getComputedStyle(vEl) : null;
  const availW = vEl ? vEl.clientWidth - parseFloat(vCs.paddingLeft) - parseFloat(vCs.paddingRight) - 4 : 700;
  const fitH = Math.min(Math.max(380, window.innerHeight - 250), availW * vbH / vbW);
  const style = wide ? `height:${Math.round(zoom*fitH)}px;width:auto;aspect-ratio:${vbW}/${vbH}` : `width:${zoom*100}%`;
  const defs = `<defs><pattern id="hatch" width="${r*0.9}" height="${r*0.9}" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="${r*0.9}" stroke="var(--fallow-line)" stroke-width="${r*0.12}"/></pattern></defs>`;
  return `<svg id="plan" viewBox="${vb}" style="${style}" role="img" aria-label="Lageplan: ${esc(lay.map(f => f.name+" "+f.breite+" × "+f.laenge+" m").join(", "))}">${defs}${g}${m}</svg>`;
}

function viewPlan(){
  const counts = {due:0,soon:0,ok:0,none:0};

  const unplaced = trees.filter(t => !isPlaced(t)).length;
  return `
  ${placing ? `<div class="placing" role="status">${placing.x!=null && plotById(placing.flaeche) ? `Baum ${esc(placing.nr||"")}: ${esc(plotName(placing.flaeche))}, Reihe ${esc(placing.reihe)}, ${kg(placing.x)} m.` : `Tippe auf die Reihe, in der Baum ${esc(placing.nr||"")} steht.`}<button id="donePlace">${placing.x!=null?"Übernehmen":"Abbrechen"}</button></div>` : ""}
  <div class="planbox">

    <div class="plantools">
      <div class="legend">
        <span><i class="dot" style="background:var(--due)"></i>überfällig ${counts.due}</span>
        <span><i class="dot" style="background:var(--soon)"></i>bald ${counts.soon}</span>

      </div>

  <p class="hint">Tippe auf einen Baum für Details. Zum Einzeichnen öffne einen Baum und wähle „Auf Plan setzen“. Beim Einzeichnen rastet der Baum auf der Mitte der angetippten Reihe ein, die Reihennummer wird automatisch übernommen.</p>`;

/* ---------- Liste ---------- */

function treeListHTML(){

}

/* ---------- Schnitt ---------- */
/* Wann eine Maßnahme typischerweise ansteht (Monate). Spritzung nur bei Bedarf, daher ohne Zeitfenster. */
/* Nur Maßnahmen, die je Baum gemacht werden; Nistkasten oder Wühlmauskontrolle betreffen eher den ganzen Garten. */
const SCHUTZ_SAISON = {"Leimring":[9,10],"Pheromonfalle":[5,6],"Stammanstrich (Weißeln)":[11,12]};
const SCHUTZ_KURZ = {"Stammanstrich (Weißeln)":"Weißeln","Netz / Vlies":"Netz","Nützlinge / Nistkasten":"Nistkasten"};
const kurz = a => SCHUTZ_KURZ[a] || a;
function saisonFuer(art, obstGruppe){
  if(art === "Netz / Vlies") return obstGruppe === "kirsche" ? [5,6] : [8,9];
  return SCHUTZ_SAISON[art] || null;
}
function pflegeInfo(t){
  const st = status(t);
  const aktiv = schutzAktiv(t);
  const fr = (t.schutz||[]).filter(m => m.bis && !m.erledigt).map(m => ({m, d: daysUntil(m.bis)}));
  const offen = fr.filter(x => x.d <= 30).sort((a,b) => a.d - b.d);
  const monat = new Date().getMonth() + 1, gruppe = SCHUTZ_GRUPPE[t.art] || "alle";
  const {empf} = schutzFuer(t.art || "Sonstige");
  const kuerzlich = art => (t.schutz||[]).some(m => m.art === art && daysSince(m.datum) <= 200);
  const jetzt = gruppe === "alle" ? [] : empf.filter(a => { const w = saisonFuer(a, gruppe); return w && w.includes(monat) && !kuerzlich(a); });
  const score = (st === "due" ? 3 : st === "soon" ? 1 : 0) + offen.reduce((n,x) => n + (x.d < 0 ? 3 : 1), 0);
  return {st, aktiv, offen, jetzt, score};
}
let pflegeFilter = "alle", pflegeSort = "dring";
function viewSchnitt(){
  if(!trees.length) return `<div class="empty">Noch keine Bäume erfasst.</div>`;
  const infos = trees.map(t => ({t, ...pflegeInfo(t)}));
  const cntDue = infos.filter(i => i.st === "due").length, cntSoon = infos.filter(i => i.st === "soon").length;
  const cntFr = infos.reduce((n,i) => n + i.offen.length, 0), cntJetzt = infos.filter(i => i.jetzt.length).length;
  const bedarf = infos.filter(i => i.score > 0).length;
  let list = infos.filter(i => (pflegeFilter === "alle" || i.score > 0) && (plotFilter === "Alle" || (plotFilter === "none" ? !isPlaced(i.t) : i.t.flaeche === plotFilter)));
  list.sort(pflegeSort === "nr" ? (a,b) => byNr(a.t, b.t) : (a,b) => b.score - a.score || b.jetzt.length - a.jetzt.length || (nextCut(a.t)||"9999").localeCompare(nextCut(b.t)||"9999") || byNr(a.t, b.t));
  const fmtFrist = d => d < 0 ? `seit ${-d} T.` : d === 0 ? "heute" : `in ${d} T.`;
  const row = i => {
    const t = i.t;
    const schutzChips = [
      ...i.offen.map(x => `<span class="sch ${x.d < 0 ? "due" : "soon"}">${picto(x.m.art, 18)}${esc(kurz(x.m.art))} · ${fmtFrist(x.d)}</span>`),
      ...i.aktiv.filter(m => !i.offen.some(x => x.m.id === m.id)).map(m => `<span class="sch ok">${picto(m.art, 18)}${esc(kurz(m.art))}${m.mittel ? ` (${esc(m.mittel)})` : ""}${m.bis ? ` bis ${fmtDate(m.bis).slice(0,6)}` : ""}</span>`),
      ...i.jetzt.map(a => `<span class="sch todo">${picto(a, 18)}${esc(kurz(a))}?</span>`)
    ];
    return `<button class="prow" data-open="${esc(t.id)}">
      <span class="pc pbaum"><span class="num" style="background:${statusColor(i.st)}">${esc(t.nr)}</span>
        <span class="t"><strong>${esc(t.art||"Baum")}${t.sorte ? " · " + esc(t.sorte) : ""}</strong><small>${esc(lageText(t) || "ohne Platz")}</small></span></span>
      <span class="pc pschnitt"><span class="plabel">Schnitt</span>
        <span class="pill ${i.st}">${esc(dueText(t))}</span>
        <small>${t.letzterSchnitt ? `zuletzt ${fmtDate(t.letzterSchnitt)}` : "noch kein Schnitt"} · alle ${t.intervall || 12} Mon.</small></span>
      <span class="pc pschutz"><span class="plabel">Pflanzenschutz</span>
        ${schutzChips.length ? `<span class="schs">${schutzChips.join("")}</span>` : `<small>nichts aktiv</small>`}</span>
    </button>`;
  };
  return `
  <div class="stats stats4">
    <div class="stat"><div class="v" style="color:${cntDue?"var(--due)":"inherit"}">${cntDue}</div><div class="l">Schnitt überfällig</div></div>
    <div class="stat"><div class="v" style="color:${cntSoon?"var(--soon)":"inherit"}">${cntSoon}</div><div class="l">Schnitt in 60 Tagen</div></div>
    <div class="stat"><div class="v" style="color:${cntFr?"var(--soon)":"inherit"}">${cntFr}</div><div class="l">Pflanzenschutz-Fristen</div></div>
    <div class="stat"><div class="v">${cntJetzt}</div><div class="l">Bäume mit Vorschlag zur Jahreszeit</div></div>
  </div>
  <div class="row" style="gap:8px">
    <div class="seg" role="group" aria-label="Filter"><button data-pfilter="alle" aria-pressed="${pflegeFilter==="alle"}">Alle Bäume</button><button data-pfilter="bedarf" aria-pressed="${pflegeFilter==="bedarf"}">Handlungsbedarf ${bedarf}</button></div>
    <div class="seg" role="group" aria-label="Sortierung"><button data-psort="dring" aria-pressed="${pflegeSort==="dring"}">Dringlichste zuerst</button><button data-psort="nr" aria-pressed="${pflegeSort==="nr"}">Nach Nummer</button></div>
  </div>
  ${garden.flaechen.length > 1 ? `<div class="chips">${[["Alle","Alle Flächen"], ...garden.flaechen.map(f => [f.id, f.name])].map(([id,n]) => `<button class="chip" data-plot="${esc(id)}" aria-pressed="${id===plotFilter}">${esc(n)}</button>`).join("")}</div>` : ""}
  <div class="ptable">
    <div class="phead2" aria-hidden="true"><span>Baum</span><span>Schnitt</span><span>Pflanzenschutz</span></div>
    ${list.length ? list.map(row).join("") : `<div class="empty" style="border:0">Kein Baum mit Handlungsbedarf. Alles im grünen Bereich.</div>`}
  </div>
  <div class="legend" style="gap:14px"><span><span class="sch due" style="padding:1px 6px">rot</span> Frist abgelaufen</span><span><span class="sch soon" style="padding:1px 6px">gelb</span> Frist in 30 Tagen</span><span><span class="sch ok" style="padding:1px 6px">grün</span> aktiv</span><span><span class="sch todo" style="padding:1px 6px">gestrichelt mit ?</span> laut Jahreszeit jetzt sinnvoll</span></div>
  <p class="hint">Nächster Schnitt = letzter Schnitt + Intervall. „Jetzt sinnvoll“ richtet sich nach Obstart und Monat und erscheint nur, wenn die Maßnahme in den letzten gut sechs Monaten nicht eingetragen wurde. Tippe auf eine Zeile, um den Baum zu öffnen.</p>`;
}

/* ---------- Ertrag ---------- */
function barChart(years, totals, selYear = statYear, label = "Gesamtertrag je Jahr in kg"){
  const max = Math.max(...totals, 1), W = 600, H = 220, padL = 44, padB = 28, padT = 14;
  const step = niceStep(max), top = Math.ceil(max/step)*step;
  const iw = W - padL - 10, ih = H - padB - padT, bw = Math.min(56, iw/years.length*0.6);
  let s = "";
  for(let v=0; v<=top; v+=step){ const y = padT + ih - v/top*ih; s += `<line x1="${padL}" x2="${W-10}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1"/><text x="${padL-6}" y="${y+4}" font-size="12" text-anchor="end" fill="var(--muted)">${v.toLocaleString("de-DE")}</text>`; }
  years.forEach((yr,i) => {
    const cx = padL + iw*(i+0.5)/years.length, h = totals[i]/top*ih, y = padT + ih - h, sel = yr===selYear;
    s += `<g data-year="${yr}" style="cursor:pointer"><rect x="${cx-bw/2-6}" y="${padT}" width="${bw+12}" height="${ih+padB}" fill="transparent"/>
      <rect x="${cx-bw/2}" y="${y}" width="${bw}" height="${Math.max(h,1)}" rx="4" fill="var(--accent)" opacity="${sel?1:0.45}"/>
      <text x="${cx}" y="${H-8}" font-size="12.5" text-anchor="middle" fill="var(${sel?"--ink":"--muted"})" font-weight="${sel?700:400}">${yr}</text>
      ${sel?`<text x="${cx}" y="${y-5}" font-size="12" text-anchor="middle" fill="var(--ink)" font-weight="700">${kg(totals[i])}</text>`:""}</g>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}">${s}</svg>`;
}
/* ---------- Ernte & Verarbeitung ---------- */

/* ---------- Apfelwein ---------- */
const addDays = (iso, n) => { const [y,m,d] = iso.split("-").map(Number); const dt = new Date(y, m-1, d + Number(n)); return dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0")+"-"+String(dt.getDate()).padStart(2,"0"); };
const daysSince = iso => -daysUntil(iso);
const HEFEN = ["Reinzuchthefe","Spontangärung"];
const KLAER = ["Von selbst (Zeit / Kälte)","Schönung (z. B. Kieselsol / Gelatine)","Filtration","Sonstiges"];
/* Faustwerte: Hauptgärung ca. 3–4 Wochen bei 16–20 °C, kühler länger; Nachgärung ca. 3–4 Wochen */
function ciderPlan(c){
  const T = Number(c.temp) || 16;
  const mainDays = Math.max(14, Math.min(60, Math.round(25 * Math.pow(2, (17 - T) / 8))));
  const mainEnd = addDays(c.angesetzt, mainDays);
  const abstichDue = addDays(mainEnd, 25);
  const trink = addDays(c.abstich || abstichDue, 21);
  return {mainDays, mainEnd, abstichDue, trink};
}
const lastOe = c => { const m = (c.messungen||[]).filter(x => x.oe != null && x.oe !== "").sort((a,b) => a.datum.localeCompare(b.datum)); return m.length ? Number(m[m.length-1].oe) : null; };
function oeStable(c){
  const m = (c.messungen||[]).filter(x => x.oe != null && x.oe !== "").sort((a,b) => a.datum.localeCompare(b.datum));
  if(m.length < 2) return false;
  const a = m[m.length-2], b = m[m.length-1];
  return Math.abs(Number(a.oe) - Number(b.oe)) <= 1 && daysUntil(b.datum) <= 0 && (daysSince(a.datum) - daysSince(b.datum)) >= 6;
}
function ciderPhase(c){
  const p = ciderPlan(c);
  if(c.abgefuellt) return {key:"abgefuellt", label:"Abgefüllt", sub: c.flaschen ? `${c.flaschen} Flaschen` : fmtDate(c.abgefuellt), pill:"none", prog:1};
  if(c.geklaert) return {key:"klar", label:"Geklärt", sub:"bereit zum Abfüllen, wenn durchgegoren", pill:"ok", prog:.95};
  if(c.abstich) return {key:"nach", label:"Abgestochen, klärt", sub:`seit ${daysSince(c.abstich)} Tagen`, pill:"ok", prog:.85};
  const total = daysSince(c.angesetzt), span = Math.max(1, -daysSince(p.abstichDue) + total);
  const prog = Math.max(0.03, Math.min(.8, total / span * .8));
  const oe = lastOe(c);
  const dMain = daysUntil(p.mainEnd);
  if(dMain > 0 && !(oe != null && oe <= 2)) return {key:"gaerung", label: total <= 7 ? "Stürmische Gärung" : "Hauptgärung", sub:`noch ca. ${dMain} Tage`, pill:"soon", prog};
  const dA = daysUntil(p.abstichDue);
  if(dA > 0 && !oeStable(c)) return {key:"nachgaerung", label:"Nachgärung", sub:`Abstich in ca. ${dA} Tagen`, pill:"soon", prog};
  return {key:"abstich", label:"Abstich fällig", sub:"vom Hefedepot abziehen", pill:"due", prog:.8};
}
function alcohol(c){
  const s0 = Number(c.oechsle); if(!(s0 > 0)) return null;
  const oe = lastOe(c);
  return {jetzt: oe != null ? Math.max(0, (s0 - oe) * 0.131) : null, moeglich: s0 * 0.131};
}
function cider(c, size, uidp){
  const ph = c ? ciderPhase(c) : {key:"gaerung"};
  const frac = c ? Math.max(0, Math.min(1, (Number(c.menge)||0) / (Number(c.volumen)||1))) : .75;
  const top = 40, bottom = 112, lvl = ph.key === "abgefuellt" ? bottom : bottom - frac * (bottom - top);
  const id = "cb" + (uidp || Math.random().toString(36).slice(2,8));
  const body = "M30 38 L30 30 L50 30 L50 38 C68 44 74 58 74 76 C74 100 62 112 40 112 C18 112 6 100 6 76 C6 58 12 44 30 38 Z";
  const active = ph.key === "gaerung" || ph.key === "nachgaerung";
  const trueb = ph.key !== "klar" && ph.key !== "nach";
  const liquidCol = trueb ? "var(--cider-trub)" : "var(--cider)";
  let inner = `<rect x="0" y="${lvl}" width="80" height="${bottom - lvl + 2}" fill="${liquidCol}" opacity="${trueb ? .9 : 1}"/>`;
  if(trueb && ph.key !== "abgefuellt") inner += [ [20,90],[48,98],[34,80],[58,84],[26,102],[52,72] ].filter(([,y]) => y > lvl + 3).map(([x,y]) => `<circle cx="${x}" cy="${y}" r="1.4" fill="var(--soil)" opacity=".8"/>`).join("");
  if(ph.key === "gaerung" && c && daysSince(c.angesetzt) <= 10) inner += Array.from({length:7}, (_,i) => `<circle cx="${12 + i*9.5}" cy="${lvl}" r="${3 + (i%2)}" fill="var(--picto-white)" opacity=".9"/>`).join("");
  if(!c || (!c.abstich && ph.key !== "abgefuellt")) inner += `<ellipse cx="40" cy="110" rx="22" ry="4" fill="var(--soil)"/>`;
  if(active) inner += `<circle class="rise" cx="30" cy="104" r="1.6" fill="var(--picto-white)"/><circle class="rise d2" cx="44" cy="100" r="1.3" fill="var(--picto-white)"/><circle class="rise d3" cx="54" cy="106" r="1.5" fill="var(--picto-white)"/>`;
  const airlock = ph.key === "abgefuellt" ? "" : `
    <path d="M40 24 V17" stroke="var(--ink)" stroke-width="2"/>
    <rect x="31" y="1" width="18" height="16" rx="4" fill="var(--glass)" stroke="var(--ink)" stroke-width="2"/>
    <rect x="33" y="9" width="14" height="6.5" rx="2" fill="var(--accent)" opacity=".45"/>
    <path d="M40 -1 V12" stroke="var(--ink)" stroke-width="1.6"/>
    <rect x="30" y="-3" width="20" height="3.5" rx="1.5" fill="var(--ink)"/>
    ${active ? `<circle class="bub" cx="37" cy="12" r="1.6" fill="var(--picto-white)"/><circle class="bub d2" cx="43" cy="12" r="1.3" fill="var(--picto-white)"/>` : ""}`;
  return `<svg class="picto" viewBox="0 -4 80 118" width="${size}" height="${Math.round(size*118/80)}" aria-hidden="true">
    <defs><clipPath id="${id}"><path d="${body}"/></clipPath></defs>
    <path d="${body}" fill="var(--glass)"/>
    <g clip-path="url(#${id})">${inner}</g>
    <path d="${body}" fill="none" stroke="var(--ink)" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M15 70 C15 60 19 52 26 48" fill="none" stroke="var(--picto-white)" stroke-width="3" stroke-linecap="round" opacity=".7"/>
    ${ph.key === "abgefuellt" ? "" : `<rect x="27" y="23" width="26" height="9" rx="2.5" fill="var(--cork)" stroke="var(--ink)" stroke-width="1.5"/>`}
    ${airlock}
  </svg>`;
}

function oeChart(c){
  const m = (c.messungen||[]).filter(x => x.oe != null && x.oe !== "").map(x => ({d: daysSince(c.angesetzt) - daysSince(x.datum), oe: Number(x.oe)}));
  if(c.oechsle) m.unshift({d:0, oe:Number(c.oechsle)});
  m.sort((a,b) => a.d - b.d);
  if(m.length < 2) return "";
  const W = 320, H = 130, pl = 30, pb = 20, pt = 10, pr = 10;
  const maxD = Math.max(...m.map(x => x.d), 7), maxO = Math.max(...m.map(x => x.oe), 10), minO = Math.min(0, ...m.map(x => x.oe));
  const X = d => pl + d / maxD * (W - pl - pr), Y = o => pt + (maxO - o) / (maxO - minO) * (H - pt - pb);
  let g = "";
  const step = maxO - minO > 40 ? 20 : 10;
  for(let v = Math.ceil(minO/step)*step; v <= maxO; v += step) g += `<line x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${pl-5}" y="${Y(v)+4}" font-size="10" text-anchor="end" fill="var(--muted)">${v}</text>`;
  g += `<text x="${W-pr}" y="${H-4}" font-size="10" text-anchor="end" fill="var(--muted)">Tag ${maxD}</text><text x="${pl}" y="${H-4}" font-size="10" fill="var(--muted)">Ansatz</text>`;
  const pts = m.map(x => `${X(x.d)},${Y(x.oe)}`).join(" ");
  g += `<polygon points="${X(m[0].d)},${Y(minO)} ${pts} ${X(m[m.length-1].d)},${Y(minO)}" fill="var(--accent)" opacity=".12"/>`;
  g += `<polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linejoin="round"/>`;
  g += m.map((x,i) => `<circle cx="${X(x.d)}" cy="${Y(x.oe)}" r="${i===m.length-1?4:2.6}" fill="var(--accent)" stroke="var(--surface)" stroke-width="1.5"/>`).join("");
  const l = m[m.length-1];
  g += `<text x="${Math.min(X(l.d), W-pr-4)}" y="${Y(l.oe)-8}" font-size="11" font-weight="700" text-anchor="end" fill="var(--ink)">${kg(l.oe)} °Oe</text>`;
  return `<div class="mchart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Verlauf des Mostgewichts in Grad Oechsle">${g}</svg></div>`;
}

function niceStep(max){ const raw = max/4, p = Math.pow(10, Math.floor(Math.log10(raw))), n = raw/p; return (n<=1?1:n<=2?2:n<=5?5:10)*p; }

function viewErtrag(){
  const years = yieldYears().filter(y => trees.some(t => yieldOf(t, y) > 0));
  if(!years.length) return personFilter !== "alle" ? `<div class="empty">Für diese Person sind keine Erträge erfasst.</div>` : `<div class="empty">Noch keine Erträge erfasst. Öffne einen Baum und trage dort unter „Ertrag (kg)“ die geerntete Menge ein.</div>`;
  if(!statYear || !years.includes(statYear)) statYear = years[years.length-1];
  const tot = y => trees.reduce((s,t) => s + yieldOf(t, y), 0);
  const totals = years.map(tot);
  const prev = years[years.indexOf(statYear)-1];
  const cur = tot(statYear), pv = prev ? tot(prev) : null;
  const delta = pv ? (cur-pv)/pv*100 : null;
  const harvested = trees.filter(t => yieldOf(t, statYear) > 0);
  // nach Art
  const arts = {};
  trees.forEach(t => { const a = t.art||"Sonstige"; arts[a] ??= {cur:0, prev:0, n:0}; arts[a].cur += yieldOf(t, statYear); if(prev) arts[a].prev += yieldOf(t, prev); if(yieldOf(t, statYear)>0) arts[a].n++; });
  const artRows = Object.entries(arts).filter(([,v]) => v.cur||v.prev).sort((a,b)=>b[1].cur-a[1].cur);
  const top = [...harvested].sort((a,b) => yieldOf(b, statYear) - yieldOf(a, statYear)).slice(0,10);
  const dl = v => v==null ? "–" : `<span class="${v>=0?"up":"down"}">${v>=0?"+":""}${Math.round(v)} %</span>`;
  return `
  <div class="chips">${years.map(y => `<button class="chip" data-year="${y}" aria-pressed="${y===statYear}">${y}</button>`).join("")}</div>
  <div class="stats">
    <div class="stat"><div class="v">${kg(cur)}</div><div class="l">kg gesamt ${statYear}</div></div>
    <div class="stat"><div class="v">${delta==null?"–":dl(delta)}</div><div class="l">${prev?"ggü. "+prev:"kein Vorjahr"}</div></div>
    <div class="stat"><div class="v">${harvested.length ? kg(cur/harvested.length) : "–"}</div><div class="l">kg je tragendem Baum</div></div>
  </div>
  <div class="card chart"><span class="eyebrow">Gesamtertrag je Jahr (kg)</span>${barChart(years, totals)}</div>
  <div class="cols"><div class="card"><span class="eyebrow">Nach Obstart · ${statYear}</span>
    <div class="tablewrap"><table class="t"><thead><tr><th>Art</th><th class="r">Bäume</th><th class="r">kg</th><th class="r">${prev?"Vorjahr":""}</th></tr></thead>
    <tbody>${artRows.map(([a,v]) => `<tr><td>${esc(a)}</td><td class="r">${v.n}</td><td class="r"><b>${kg(v.cur)}</b></td><td class="r">${prev ? dl(v.prev ? (v.cur-v.prev)/v.prev*100 : null) : ""}</td></tr>`).join("")}</tbody></table></div>
  </div>
  <div class="card"><span class="eyebrow">Ertragsstärkste Bäume · ${statYear}</span>
    ${top.length ? `<div class="list" style="border:0">${top.map(t => { const p = prev ? yieldOf(t, prev) : 0; const d = p ? (yieldOf(t, statYear)-p)/p*100 : null; return treeItem(t, `<span style="text-align:right;font-variant-numeric:tabular-nums"><b>${kg(yieldOf(t, statYear))} kg</b><br><small>${prev?dl(d):""}</small></span>`); }).join("")}</div>` : `<p class="hint">Für ${statYear} ist kein Ertrag erfasst.</p>`}
  </div></div>
  ${personFilter === "alle" ? (() => {
    const rows = {};
    const row = id => rows[id] ??= {kg:0, baeume:0, eintraege:0};
    trees.forEach(t => { const v = Number((t.ertrag||{})[statYear])||0; if(v){ const r = row(yieldBy(t, statYear)); r.kg += v; r.baeume++; } });
    batches.filter(b => batchYearOf(b) === statYear).forEach(b => row(b.by || UNBEKANNT).eintraege++);
    const ids = Object.keys(rows); if(ids.length < 1 || (ids.length === 1 && ids[0] === UNBEKANNT)) return "";
    return `<div class="card"><span class="eyebrow">Eingetragen von · ${statYear}</span><div class="tablewrap"><table class="t"><thead><tr><th>Person</th><th class="r">Bäume</th><th class="r">kg</th><th class="r">Erzeugnisse</th></tr></thead><tbody>${ids.sort((a,b) => rows[b].kg - rows[a].kg).map(id => `<tr><td><button class="linkbtn" style="padding:0;font-size:.9rem;display:inline-flex;gap:6px;align-items:center;color:var(--ink)" data-person="${esc(id)}">${id===UNBEKANNT?"":avatar(id,20)}${esc(id===UNBEKANNT?"Ohne Angabe":personName(id))}</button></td><td class="r">${rows[id].baeume}</td><td class="r"><b>${kg(rows[id].kg)}</b></td><td class="r">${rows[id].eintraege}</td></tr>`).join("")}</tbody></table></div><p class="hint" style="margin:0">Tippe auf eine Person, um die Statistik nur für ihre Einträge zu sehen.</p></div>`;
  })() : ""}`;
}

function withRow(t){

/* ---------- Rendern ---------- */

  $("#title").firstChild.nodeValue = name;
  $("#subtitle").textContent = loaded ? `${trees.length} Bäume · ${garden.flaechen.length} Grundstücke · ${kg(totalArea())} m²` : (db ? "wird geladen …" : "Datenspeicher nicht erreichbar");
  const due = trees.filter(t => status(t)==="due").length + schutzFristen().filter(x => x.d < 0).length;
  const b = $("#dueBadge"); b.hidden = !due; b.textContent = due;
  const wd = casks.filter(c => !c.abgefuellt && ciderPhase(c).key === "abstich").length;
  const wb = $("#weinBadge"); wb.hidden = !wd; wb.textContent = wd;
  if(!tabVisible(tab)){ const first = Object.keys(TAB_BEREICH).find(tabVisible); if(first) tab = first; }
  $("#btnSettings").hidden = !!window.OG_HOST && !isAdmin();
  $("#btnLogout").hidden = !window.OG_HOST || isAdmin();
  document.querySelectorAll("nav.tabs button").forEach(x => { x.hidden = !tabVisible(x.dataset.tab); x.setAttribute("aria-current", x.dataset.tab===tab ? "page" : "false"); });
  const v = $("#view");
  const keepScroll = $("#planscroll") ? [$("#planscroll").scrollLeft, $("#planscroll").scrollTop] : null;
  const examples = trees.some(t => t.beispiel) || batches.some(b => b.beispiel) || casks.some(c => c.beispiel);
  const banner = (loaded && db && tab !== "verwaltung" && !anyWrite(TAB_BEREICH[tab]) ? `<div class="note"><span>Du hast in diesem Bereich nur <b>Lesezugriff</b>.</span></div>` : "") + (examples && !placing ? `<div class="note"><span>Du siehst <b>Beispieldaten</b>. Lege deine eigenen an und lösche die Beispiele unter ⚙︎.</span></div>` : "");
  // Verwaltung: aufgeklappte Personen und Eingaben beim Neuzeichnen behalten
  const vkey = x => x.id || ((x.closest("[data-oguser]")||{}).dataset||{}).oguser + "|" + (x.dataset.ogr || (x.hasAttribute("data-ogrole") ? "role" : "")) + "|" + (x.dataset.oga || "");
  const keepV = !window.OG_FRESH && tab === "verwaltung" && v.querySelector(".vstack") ? {
    open: [...v.querySelectorAll("details")].map(x => x.open),
    vals: [...v.querySelectorAll("input,select")].map(x => [vkey(x), x.type === "checkbox" ? x.checked : x.value]),
    y: window.scrollY } : null;
  v.innerHTML = banner + ({plan:viewPlan, baeume:viewBaeume, schnitt:viewSchnitt, ernte:viewErtragTab, wein:viewWein, verwaltung:viewVerwaltung}[tab] || viewPlan)();
  if(keepV){
    v.querySelectorAll("details").forEach((x, i) => { if(keepV.open[i]) x.open = true; });
    const m = new Map(keepV.vals); v.querySelectorAll("input,select").forEach(x => { const k = vkey(x); if(m.has(k) && x.type !== "submit"){ if(x.type === "checkbox") x.checked = m.get(k); else x.value = m.get(k); } });
    window.scrollTo(0, keepV.y);
  }
  window.OG_FRESH = false;
  if(keepScroll && $("#planscroll")){ $("#planscroll").scrollLeft = keepScroll[0]; $("#planscroll").scrollTop = keepScroll[1]; }
  const canAdd = tab !== "verwaltung" && canDo(ADD_BEREICH[tab], "anlegen");
  $("#fab").hidden = !!placing || (tab==="ernte" && ertragSeg==="statistik") || !canAdd;
  $("#fab").setAttribute("aria-label", tab==="ernte" ? "Eintrag hinzufügen" : tab==="wein" ? "Gärbehälter hinzufügen" : "Baum hinzufügen");
  $("#btnAddTop").textContent = tab==="ernte" ? "+ Eintrag" : tab==="wein" ? "+ Behälter" : "+ Baum";
  $("#btnAddTop").hidden = (tab==="ernte" && ertragSeg==="statistik") || !canAdd;
  renderSheet();
}
function renderSheet(){
  const el = $("#sheet");
  if(!sheetState || placing){ el.hidden = true; el.innerHTML = ""; document.body.classList.remove("sheet-open"); return; }
  const was = el.hidden; el.hidden = false; document.body.classList.add("sheet-open");
  if(sheetState.mode === "detail"){
    const t = trees.find(x => x.id === sheetState.id);
    if(!t){ sheetState = null; return renderSheet(); }
    // Formular für Ertrag nicht zerstören, während getippt wird
    const keep = {}; el.querySelectorAll("input[id],select[id]").forEach(i => keep[i.id] = i.value);
    const gOpen = !!(el.querySelector("#gdet")||{}).open;
    const st = el.scrollTop;
    el.innerHTML = sheetDetail(t);
    Object.entries(keep).forEach(([id,v]) => { const i = el.querySelector("#"+id); if(i) i.value = v; });
    syncSchutzForm(); const gd = el.querySelector("#gdet"); if(gd && gOpen) gd.open = true;
    if(!was) el.scrollTop = st;
  } else if(sheetState.mode === "edit"){
    if(!el.querySelector("#treeForm") || sheetState.dirtyRender){ el.innerHTML = sheetEdit(sheetState.draft, sheetState.isNew); sheetState.dirtyRender = false; }
  } else if(sheetState.mode === "cask"){
    const c = casks.find(x => x.id === sheetState.id);
    if(!c){ sheetState = null; return renderSheet(); }
    const keep = {}; el.querySelectorAll("input[id],select[id]").forEach(i => keep[i.id] = i.value);
    const st = el.scrollTop;
    el.innerHTML = sheetCask(c);
    Object.entries(keep).forEach(([id,v]) => { const i = el.querySelector("#"+id); if(i) i.value = v; });
    if(!was) el.scrollTop = st;
  } else if(sheetState.mode === "caskedit"){
    if(!el.querySelector("#caskForm") || sheetState.dirtyRender){ el.innerHTML = sheetCaskEdit(sheetState.draft, sheetState.isNew); sheetState.dirtyRender = false; }
  } else if(sheetState.mode === "log"){
    el.innerHTML = sheetLog();
  } else if(sheetState.mode === "batch"){
    if(!el.querySelector("#batchForm") || sheetState.dirtyRender){ el.innerHTML = sheetBatch(sheetState.draft, sheetState.isNew); sheetState.dirtyRender = false; }
  } else if(sheetState.mode === "guide"){
    if(!el.querySelector("#guideSheet")) el.innerHTML = `
      <div class="sheethead" id="guideSheet"><div class="wrap"><button class="linkbtn" data-guideback>‹ Zurück</button><h2>Pflanzenschutz-Ratgeber</h2></div></div>
      <div class="wrap body"><p class="hint" style="margin:0">Kurzanleitungen zu allen Maßnahmen. Angaben auf Packungen und Gebrauchsanleitungen gehen immer vor.</p>
      ${(() => { const tr = trees.find(x => x.id === sheetState.back), obst = tr ? (tr.art||"Sonstige") : null;
        if(!obst || (SCHUTZ_GRUPPE[obst]||"alle") === "alle") return `<div class="guides">${SCHUTZ_ARTEN.filter(a => a !== "Sonstiges").map(a => guideHTML(a, false)).join("")}</div>`;
        const {empf, weitere} = schutzFuer(obst);
        return `<span class="eyebrow">Empfohlen für ${esc(obst)}</span><div class="guides">${empf.map(a => guideHTML(a, false, obst)).join("")}</div>
          <span class="eyebrow">Weitere Maßnahmen</span><div class="guides">${weitere.filter(a => a !== "Sonstiges").map(a => guideHTML(a, false)).join("")}</div>`; })()}</div>`;
  } else if(sheetState.mode === "settings"){
    if(!el.querySelector("#setForm") || sheetState.dirtyRender){ el.innerHTML = sheetSettings(); sheetState.dirtyRender = false; }
  }
  if(was) el.scrollTop = 0;
}
function syncSchutzForm(){
  const a = $("#m_art"); if(!a) return;
  const box = $("#m_guide");
  const tr = sheetState && trees.find(x => x.id === sheetState.id), obst = tr ? (tr.art||"Sonstige") : null;
  if(box.dataset.art !== a.value + "|" + obst){ const open = !!(box.querySelector("details")||{}).open; box.innerHTML = guideHTML(a.value, true, obst); box.dataset.art = a.value + "|" + obst; const dt = box.querySelector("details"); if(dt && open) dt.open = true; }
  $("#m_mittel_f").hidden = !["Spritzung","Raupenleim","Stammanstrich (Weißeln)","Sonstiges"].includes(a.value);
}
function openDetail(id){ sheetState = {mode:"detail", id}; render(); }
function openEdit(t){
  const isNew = !t;
  const nextNr = trees.reduce((m,x) => Math.max(m, parseInt(x.nr)||0), 0) + 1;
  const draft = t ? {...t} : {nr:String(nextNr), art:"Apfel", sorte:"", wuchs:"Hochstamm", pflanzjahr:null, letzterSchnitt:null, intervall:12, notiz:"", x:null, y:null, ertrag:{}, schnitte:[]};
  sheetState = {mode:"edit", id: t ? t.id : null, draft, isNew, dirtyRender:true};
  render();
}

/* ---------- Ereignisse ---------- */
document.addEventListener("click", async e => {
  const el = e.target.closest("button, g[data-id], g[data-year]");
  // Plan-Klick
  const svg = e.target.closest("#plan");
  if(svg && placing){
    const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
    const p = pt.matrixTransform(svg.getScreenCTM().inverse());
    const tol = 1.5;
    const f = plotLayout().find(f => p.x >= f.ox - tol && p.x <= f.ox + f.breite + tol && p.y >= -tol && p.y <= f.laenge + tol);
    if(!f){ toast("Bitte innerhalb eines Grundstücks tippen."); return; }
    if(!P.grund(f.id, placing.id ? "aendern" : "anlegen")){ toast(`Auf ${f.name} darfst du das nicht.`); return; }
    placing.flaeche = f.id;
    placing.x = Math.round(Math.min(f.breite, Math.max(0, p.x - f.ox))*10)/10;
    const row = rowOf(f, Math.min(f.laenge, Math.max(0, p.y)));
    if(isFreeRow(f, row)){ toast(`Reihe ${row} auf ${f.name} ist als nicht bepflanzt markiert.`); return; }
    placing.y = rowCenter(f, row); placing.reihe = String(row);
    render(); return;
  }
  if(!el) return;
  const d = el.dataset;
  if(d.tab){ tab = d.tab; window.scrollTo(0,0); render(); return; }
  if(d.goto){ tab = d.goto; render(); return; }
  if(d.id && !placing){ openDetail(d.id); return; }
  if(d.open){ openDetail(d.open); return; }
  if(d.zoom){ zoom = Math.min(4, Math.max(1, zoom + Number(d.zoom)*0.5)); render(); return; }
  if(d.art){ artFilter = d.art; render(); return; }
  if(d.plot){ plotFilter = d.plot; render(); return; }
  if(window.OG_HOST && OG_HOST.onClick && await OG_HOST.onClick(el, d)) return;
  if(d.pfilter){ pflegeFilter = d.pfilter; render(); return; }
  if(d.psort){ pflegeSort = d.psort; render(); return; }
  if(d.person){ personFilter = d.person; render(); return; }
  if(d.logp){ sheetState.filter = d.logp; renderSheet(); return; }
  if(d.vlogp){ vlogFilter = d.vlogp; render(); return; }
  if(d.vsub){ vsub = d.vsub; window.OG_FRESH = true; render(); window.scrollTo(0, 0); return; }
  if(el.hasAttribute("data-opensettings")){ $("#btnSettings").click(); return; }
  if(el.id === "btnLog"){ sheetState = {mode:"log", filter:"alle"}; render(); refreshPeople(); return; }
  if(d.seg){ ertragSeg = d.seg; try{ localStorage.setItem("obstgarten.ertragSeg", d.seg); }catch(_){} if(d.seg === "statistik" && batchYear) statYear = batchYear; else if(statYear) batchYear = statYear; render(); return; }
  if(d.year && tab==="ernte" && !el.closest("#sheet")){ statYear = d.year; batchYear = d.year; render(); return; }
  if(el.hasAttribute("data-close")){ sheetState = null; render(); return; }
  if(el.hasAttribute("data-cancel")){ sheetState = sheetState.id ? {mode:"detail", id:sheetState.id} : null; render(); return; }
  if(d.edit){ openEdit(trees.find(t => t.id === d.edit)); return; }
  if(d.showplan){ sheetState = {mode:"detail", id:d.showplan}; tab = "plan"; const t = trees.find(x=>x.id===d.showplan); sheetState = null; render(); highlight(t); return; }
  if(d.cut){
    const t = trees.find(x => x.id === d.cut); if(!t) return;
    const today = todayISO(); const s = new Set(t.schnitte||[]); if(t.letzterSchnitt) s.add(t.letzterSchnitt); s.add(today);
    const body = treeBody({...t, letzterSchnitt: today, letzterSchnittVon: meId, schnitte:[...s].sort().slice(-20)});
    await save(() => db.collection("trees").doc(t.id).set(body), `Schnitt am ${fmtDate(today)} eingetragen`, `Baum ${t.nr}`);
    return;
  }
  if(d.delyield){
    const t = trees.find(x => x.id === sheetState.id); if(!t) return;
    const ert = {...(t.ertrag||{})}; delete ert[d.delyield];
    const em = {...(t.ertragMeta||{})}; delete em[d.delyield];
    await save(() => db.collection("trees").doc(t.id).set(treeBody({...t, ertrag: ert, ertragMeta: em})), `Ertrag ${d.delyield} gelöscht`, `Baum ${t.nr}`);
    return;
  }
  if(d.guide){ sheetState = {mode:"guide", back:d.guide}; render(); return; }
  if(el.hasAttribute("data-guideback")){ sheetState = sheetState.back ? {mode:"detail", id:sheetState.back} : null; render(); return; }
  if(d.mdone || d.mdel){
    const t = trees.find(x => x.id === sheetState.id); if(!t) return;
    const list = (t.schutz||[]).map(m => ({...m}));
    let next, msg;
    if(d.mdone){ const mm = list.find(m => m.id === d.mdone); next = list.map(m => m.id === d.mdone ? {...m, erledigt:true, erledigtVon: meId} : m); msg = `${mm ? mm.art : "Maßnahme"} als erledigt markiert`; }
    else {
      if(el.dataset.armed !== "1"){ el.dataset.armed = "1"; el.textContent = "?"; el.setAttribute("aria-label","Nochmal tippen zum Löschen"); return; }
      const mm = list.find(m => m.id === d.mdel); next = list.filter(m => m.id !== d.mdel); msg = `${mm ? mm.art : "Maßnahme"} gelöscht`;
    }
    await save(() => db.collection("trees").doc(t.id).set(treeBody({...t, schutz: next})), msg, `Baum ${t.nr}`);
    return;
  }
  if(el.id === "btnExport"){ doExport(); return; }
  if(d.place){ const t = trees.find(x => x.id === d.place); startPlacing({...t}, false); return; }
  if(el.id === "f_place"){ startPlacing(readForm(sheetState.draft), true); return; }
  if(el.id === "donePlace"){ finishPlacing(); return; }
  if(el.id === "btnLogout"){
    if(PERM() && PERM().preview){ toast("In der Vorschau nicht möglich – hier würde sich die Person abmelden."); return; }
    if(el.dataset.armed !== "1"){ el.dataset.armed = "1"; toast("Zum Abmelden nochmal tippen"); setTimeout(() => { el.dataset.armed = "0"; }, 3000); return; }
    OG_HOST.logout(); return;
  }
  if(el.id === "btnSettings" && window.OG_HOST && !isAdmin()) return;
  if(el.id === "btnSettings"){ sheetState = {mode:"settings", name: garden.name||"", draft: garden.flaechen.map(f => ({...f})), dirtyRender:true}; render(); return; }
  if(d.plotidx != null && d.row){
    const f = sheetState.draft[Number(d.plotidx)], n = Number(d.row);
    const set = new Set(f.freieReihen||[]); set.has(n) ? set.delete(n) : set.add(n);
    f.freieReihen = [...set].sort((a,b)=>a-b);
    el.setAttribute("aria-pressed", set.has(n));
    return;
  }
  if(el.id === "addPlot" || d.rmplot){
    readSettings();
    if(el.id === "addPlot"){ const n = sheetState.draft.length + 1; sheetState.draft.push({id:"g"+uid(), name:`Grundstück ${n}`, breite:20, laenge:60, reihen:12, freieReihen:[]}); }
    else sheetState.draft.splice(Number(d.rmplot), 1);
    sheetState.dirtyRender = true; renderSheet(); return;
  }
  if(el.id === "fab" || el.id === "btnAddTop"){ tab === "ernte" ? openBatch(null) : tab === "wein" ? openCaskEdit(null) : openEdit(null); return; }
  if(d.cask){ sheetState = {mode:"cask", id:d.cask}; render(); return; }
  if(d.caskedit){ openCaskEdit(casks.find(c => c.id === d.caskedit)); return; }
  if(el.hasAttribute("data-caskcancel")){ sheetState = sheetState.id ? {mode:"cask", id:sheetState.id} : null; render(); return; }
  if(d.caskstep){
    const c = casks.find(x => x.id === sheetState.id); if(!c) return;
    const upd = {...c}, today = todayISO();
    if(d.caskstep === "abstich"){ upd.abstich = today; upd.abstichVon = meId; }
    if(d.caskstep === "geklaert"){ upd.geklaert = today; upd.geklaertVon = meId; upd.klaerMethode = $("#k_meth") ? $("#k_meth").value : ""; }
    if(d.caskstep === "abgefuellt"){
      const fl = parseInt($("#a_fl").value), l = parseFloat(String($("#a_l").value).replace(",", "."));
      if(lastOe(c) != null && lastOe(c) > 5 && el.dataset.armed !== "1"){ el.dataset.armed = "1"; el.textContent = "Noch nicht durchgegoren – trotzdem?"; return; }
      upd.abgefuellt = today; upd.abgefuelltVon = meId; if(fl > 0) upd.flaschen = fl; if(l > 0) upd.abfuellLiter = Math.round(l*10)/10;
      if(!upd.abstich) upd.abstich = upd.abstich || null;
    }
    await save(() => db.collection("keller").doc(c.id).set(caskBody(upd)), ({abstich:"Abstich eingetragen", geklaert:"Klärung eingetragen", abgefuellt:"Abfüllung eingetragen"})[d.caskstep], c.name);
    return;
  }
  if(d.mdelc){
    const c = casks.find(x => x.id === sheetState.id); if(!c) return;
    if(el.dataset.armed !== "1"){ el.dataset.armed = "1"; el.textContent = "?"; return; }
    await save(() => db.collection("keller").doc(c.id).set(caskBody({...c, messungen:(c.messungen||[]).filter(m => m.id !== d.mdelc)})), "Messung gelöscht", c.name);

  if(el.id === "delBatch"){

    sheetState = null; render(); return;
  }

  }
  if(/^s_fr\d+$/.test(e.target.id) && sheetState && sheetState.mode === "settings"){ readSettings(); sheetState.dirtyRender = true; renderSheet(); return; }
  if(e.target.id === "b_typ"){ const t = VERARB_TYPEN[e.target.value]; if(t) $("#b_einheit").value = t.einheit; $("#b_icon").innerHTML = vIcon(e.target.value, 52, $("#b_obst").value, e.target.value === "Saft" && ["","Apfel","Gemischt"].includes($("#b_obst").value)); return; }
  if(e.target.id === "b_obst"){ $("#b_icon").innerHTML = vIcon($("#b_typ").value, 52, e.target.value, $("#b_typ").value === "Saft" && ["","Apfel","Gemischt"].includes(e.target.value)); return; }
  if(e.target.id === "m_art"){
    syncSchutzForm();
    if(e.target.value === "Leimring" && !$("#m_bis").value){ const y = new Date().getFullYear() + (new Date().getMonth() >= 6 ? 1 : 0); $("#m_bis").value = y+"-03-31"; }
  }
  if(e.target.id === "f_art"){ $("#f_hint").textContent = SCHNITTZEIT[e.target.value] || SCHNITTZEIT.Sonstige; }
});
document.addEventListener("submit", async e => {
  e.preventDefault();
  if(e.target.id === "treeForm"){
    const d = readForm(sheetState.draft);
    if(!d.nr){ toast("Bitte eine Nummer vergeben."); return; }
    if(trees.some(t => t.id !== sheetState.id && String(t.nr) === d.nr)){ toast(`Nummer ${d.nr} ist schon vergeben.`); return; }
    d.beispiel = false;
    if(d.letzterSchnitt){ const s = new Set(d.schnitte||[]); s.add(d.letzterSchnitt); d.schnitte = [...s].sort().slice(-20); }
    const orig = trees.find(t => t.id === sheetState.id);
    if(d.letzterSchnitt && (!orig || orig.letzterSchnitt !== d.letzterSchnitt)) d.letzterSchnittVon = meId;
    if(sheetState.isNew) d.angelegtVon = meId;
    const ref = sheetState.id ? db?.collection("trees").doc(sheetState.id) : db?.collection("trees").doc();
    if(await save(() => ref.set(treeBody(withRow(d))), sheetState.isNew ? `Baum ${d.nr} angelegt` : `Baum ${d.nr} bearbeitet`)){
      sheetState = {mode:"detail", id: ref.id}; render();
    }
  }
  if(e.target.id === "yieldForm"){
    const t = trees.find(x => x.id === sheetState.id); if(!t) return;
    const y = String(parseInt($("#yYear").value)); const v = parseFloat(String($("#yKg").value).replace(",", "."));
    if((t.ertrag||{})[y] != null && !canDo("ertrag", "aendern", t.flaeche)){ toast(`Für ${y} ist schon ein Ertrag eingetragen – Ändern ist für dich nicht freigegeben.`); return; }
    if((t.ertrag||{})[y] != null && !P.mine(((t.ertragMeta||{})[y]||{}).by || t._creator)){ toast(`Ertrag ${y} hat jemand anderes eingetragen – nur diese Person oder die Verwaltung kann ihn ändern.`); return; }
    if(!(y > 1900) || !(v >= 0)){ toast("Bitte Jahr und Menge in kg angeben."); return; }
    $("#yKg").value = "";
    await save(() => db.collection("trees").doc(t.id).set(treeBody({...t, ertrag:{...(t.ertrag||{}), [y]: Math.round(v*10)/10}, ertragMeta:{...(t.ertragMeta||{}), [y]: {by: meId, at: nowISO()}}})), `${kg(v)} kg Ertrag für ${y} eingetragen`, `Baum ${t.nr}`);
  }
  if(e.target.id === "schutzForm"){
    const t = trees.find(x => x.id === sheetState.id); if(!t) return;
    const art = $("#m_art").value, datum = $("#m_datum").value;
    if(!datum){ toast("Bitte ein Datum angeben."); return; }
    const mittel = $("#m_mittel_f").hidden ? "" : $("#m_mittel").value.trim();
    if(art === "Spritzung" && !mittel){ toast("Bitte angeben, womit gespritzt wurde."); return; }
    const m = {id: uid(), art, datum, mittel, bis: $("#m_bis").value || null, notiz: $("#m_notiz").value.trim(), erledigt:false, by: meId, at: nowISO()};
    if(await save(() => db.collection("trees").doc(t.id).set(treeBody({...t, schutz:[...(t.schutz||[]), m]})), `${art}${mittel?` (${mittel})`:""} eingetragen`, `Baum ${t.nr}`)){
      ["m_mittel","m_bis","m_notiz"].forEach(id => { const i = $("#"+id); if(i) i.value = ""; });
    }
  }
  if(e.target.id === "oeForm"){
    const c = casks.find(x => x.id === sheetState.id); if(!c) return;
    const num = id => { const v = String($(id).value).replace(",", ".").trim(); return v === "" ? null : Number(v); };
    const oe = num("#o_oe"), tp = num("#o_t");
    if(oe == null && tp == null){ toast("Bitte °Oechsle oder Temperatur eintragen."); return; }
    const m = {id: uid(), datum: $("#o_d").value || todayISO(), oe, temp: tp, notiz: $("#o_n").value.trim(), by: meId};
    if(await save(() => db.collection("keller").doc(c.id).set(caskBody({...c, messungen:[...(c.messungen||[]), m]})), `Messung ${oe != null ? kg(oe) + " °Oe" : kg(tp) + " °C"} eingetragen`, c.name)){
      ["o_oe","o_t","o_n"].forEach(i => { const x = $("#"+i); if(x) x.value = ""; });
    }
    return;
  }
  if(e.target.id === "caskForm"){
    const num = id => { const v = String($(id).value).replace(",", ".").trim(); return v === "" ? null : Number(v); };
    const d0 = sheetState.draft;
    const body = {...d0, name: $("#c_name").value.trim(), volumen: num("#c_vol"), menge: num("#c_menge"), angesetzt: $("#c_ang").value,
      temp: num("#c_temp"), obst: $("#c_obst").value.trim(), speierling: $("#c_sp").checked, oechsle: num("#c_oe"), saeure: num("#c_s"),
      hefe: $("#c_hefe").value, hefeName: $("#c_hn").value.trim(), zusaetze: $("#c_z").value.trim(), standort: $("#c_ort").value.trim(),
      abstich: $("#c_ab").value || null, geklaert: $("#c_kl").value || null, klaerMethode: $("#c_km").value, abgefuellt: $("#c_af").value || null,
      flaschen: num("#c_fl"), notiz: $("#c_n").value, beispiel:false};
    if(!body.name || !(body.volumen > 0) || !(body.menge >= 0) || !body.angesetzt){ toast("Bitte Bezeichnung, Behältergröße, Menge und Datum angeben."); return; }
    if(body.menge > body.volumen){ toast("Es ist mehr Saft eingetragen, als in den Behälter passt."); return; }
    const ref = sheetState.id ? db?.collection("keller").doc(sheetState.id) : db?.collection("keller").doc();
    if(sheetState.isNew) body.by = meId;
    if(await save(() => ref.set(caskBody(body)), sheetState.isNew ? `${kg(body.menge)} l angesetzt` : "bearbeitet", body.name)){
      sheetState = {mode:"cask", id: ref.id}; render();
    }
    return;
  }
  if(e.target.id === "batchForm"){
    const menge = parseFloat(String($("#b_menge").value).replace(",", "."));
    const datum = $("#b_datum").value;
    if(!datum || !(menge >= 0)){ toast("Bitte Datum und Menge angeben."); return; }
    const okg = parseFloat(String($("#b_kg").value).replace(",", "."));
    const body = {typ: $("#b_typ").value, datum, menge: Math.round(menge*10)/10, einheit: $("#b_einheit").value, obst: $("#b_obst").value,
      obstKg: okg > 0 ? Math.round(okg*10)/10 : null, ort: $("#b_ort").value.trim(), notiz: $("#b_notiz").value, beispiel:false};
    const orig = batches.find(b => b.id === sheetState.id);
    body.by = orig ? (orig.by || null) : meId; body.at = orig ? (orig.at || null) : nowISO();
    const ref = sheetState.id ? db?.collection("verarbeitung").doc(sheetState.id) : db?.collection("verarbeitung").doc();
    if(await save(() => ref.set(plain(stamp(body))), `${fmtMenge(body.menge, body.einheit)} ${body.typ}${body.obst?` (${body.obst})`:""} ${orig ? "geändert" : "eingetragen"}`, "Ertrag")){
      batchYear = datum.slice(0,4); sheetState = null; render();
    }
    return;
  }
  if(e.target.id === "setForm"){
    readSettings();
    const fl = sheetState.draft;
    if(fl.some(f => !(f.breite >= 2) || !(f.laenge >= 2) || !(f.reihen >= 1))){ toast("Bitte gültige Maße in Metern angeben."); return; }
    if(fl.some(f => !f.name)){ toast("Bitte jedem Grundstück eine Bezeichnung geben."); return; }
    const body = {name: sheetState.name, flaechen: fl};
    if(await save(() => db.doc("settings/garten").set(body), "Grundstücke geändert", "Einstellungen")){ sheetState = null; render(); }
  }
});

function readSettings(){
  if(!$("#setForm")) return;
  sheetState.name = $("#s_name").value.trim();
  sheetState.draft = sheetState.draft.map((f,i) => ({id: f.id, name: $("#s_fn"+i).value.trim(), breite: parseFloat($("#s_fb"+i).value), laenge: parseFloat($("#s_fl"+i).value), reihen: parseInt($("#s_fr"+i).value), freieReihen: (f.freieReihen||[]).filter(n => n <= parseInt($("#s_fr"+i).value))}));
}
function startPlacing(draft, fromForm){
  placing = draft; placing._fromForm = fromForm; placing._prev = {x:draft.x, y:draft.y, flaeche:draft.flaeche};
  tab = "plan"; window.scrollTo(0,0); render();
}
async function finishPlacing(){
  const p = placing; placing = null;
  const moved = p.x != null && (p.x !== p._prev.x || p.y !== p._prev.y || p.flaeche !== p._prev.flaeche);
  const {_fromForm, _prev, ...draft} = p;
  if(_fromForm){
    sheetState.draft = draft; sheetState.dirtyRender = true; render();
  } else {
    if(moved) await save(() => db.collection("trees").doc(draft.id).set(treeBody(withRow(draft))), `Baum ${draft.nr} eingezeichnet`, "Plan");
    sheetState = {mode:"detail", id:draft.id}; render();
  }
}
function highlight(t){
  if(!t) return;
  requestAnimationFrame(() => {
    const g = document.querySelector(`#plan g[data-id="${CSS.escape(t.id)}"] circle`);
    if(g){ g.setAttribute("stroke","var(--ink)"); g.scrollIntoView({block:"center", inline:"center", behavior:"smooth"}); }
  });
}

document.addEventListener("keydown", e => {
  if(e.key !== "Escape") return;
  if(placing){ placing = null; render(); return; }
  if(sheetState){ sheetState = sheetState.mode === "edit" && sheetState.id ? {mode:"detail", id:sheetState.id} : sheetState.mode === "guide" && sheetState.back ? {mode:"detail", id:sheetState.back} : sheetState.mode === "caskedit" && sheetState.id ? {mode:"cask", id:sheetState.id} : null; render(); }
});
let _rz; window.addEventListener("resize", () => { clearTimeout(_rz); _rz = setTimeout(() => { if(tab === "plan") render(); }, 150); });

/* ---------- Daten ---------- */
window.OG_APP = {goto: t => { tab = t; render(); }, flaechen: () => garden.flaechen, render: () => render(), refreshPeople: () => { _pp = null; refreshPeople(); }, toast: m => toast(m), closeSheet: () => { sheetState = null; render(); }};
render();
(async () => {
  const c = window.claude;
  try{ db = c && c.use ? await c.use("db") : null; }catch(_){ db = null; }
  if(!db){ loaded = true; render(); return; }
  try{ userApi = c && c.use ? await c.use("user") : null; }catch(_){ userApi = null; }
  if(userApi){
    try{ meId = await userApi.id(); }catch(_){ meId = null; }
    try{ canWrite = await userApi.can("data.write"); }catch(_){ canWrite = null; }
    refreshPeople();
  }
  db.collection("protokoll").orderBy("at", "desc").limit(300).onSnapshot(snap => {
    protokoll = snap.docs.map(d => ({id:d.id, ...d.data()}));
    refreshPeople();
    if(sheetState && sheetState.mode === "log") renderSheet();
  }, () => {});
  const timer = setTimeout(() => { if(!loaded){ $("#subtitle").textContent = "Daten noch nicht erreichbar …"; } }, 10000);
  db.collection("trees").onSnapshot(snap => {
    trees = snap.docs.map(d => ({id:d.id, ...d.data()})); refreshPeople();
    if(!snap.metadata.fromCache){ loaded = true; clearTimeout(timer); }
    else loaded = true;
    render();
  }, err => { loaded = true; clearTimeout(timer); toast("Bäume konnten nicht geladen werden."); render(); });
  db.collection("keller").onSnapshot(snap => {
    casks = snap.docs.map(d => ({id:d.id, ...d.data()})); refreshPeople();
    if(!(sheetState && sheetState.mode === "caskedit")) render();
  }, () => {});
  db.collection("verarbeitung").onSnapshot(snap => {
    batches = snap.docs.map(d => ({id:d.id, ...d.data()})); refreshPeople();
    if(!(sheetState && sheetState.mode === "batch")) render();
  }, () => {});
  db.doc("settings/garten").onSnapshot(snap => {
    if(snap.exists){ const v = snap.data(); garden = {name: v.name||"", flaechen: normFlaechen(v)}; }
    if(!(sheetState && sheetState.mode === "settings")) render();
  }, () => {});
})();
})();
</script>
